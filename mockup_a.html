<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { background-color: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .trmnl-screen { width: 800px; height: 480px; background-color: #ffffff; border: 10px solid #333; border-radius: 12px; display: flex; flex-direction: column; padding: 30px; box-sizing: border-box; color: #000; }
  .list { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 40px; flex-grow: 1; align-content: start; }
  .item { display: flex; align-items: center; gap: 15px; border-bottom: 2px solid #ddd; padding-bottom: 15px; }
  .item:nth-last-child(-n+2) { border-bottom: none; }
  .plant-image { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; filter: grayscale(100%) contrast(150%); border: 3px solid #000; flex-shrink: 0; }
  .content { display: flex; flex-direction: column; gap: 4px; }
  .title { font-size: 26px; font-weight: 700; display: flex; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 16px; background-color: #000; color: #fff; padding: 4px 10px; border-radius: 15px; margin-left: 10px; font-weight: normal; white-space: nowrap; }
  .description { font-size: 20px; color: #444; }
  .title_bar { border-top: 3px solid #000; padding-top: 20px; display: flex; align-items: center; justify-content: space-between; font-size: 22px; font-weight: bold; margin-top: auto; }
</style>
</head>
<body>
<div class="trmnl-screen">
  <div class="list">
    <div class="item">
      <img class="plant-image" src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/%D7%A6%D7%91%D7%A2%D7%95%D7%A0%D7%99%D7%9D.JPG/500px-%D7%A6%D7%91%D7%A2%D7%95%D7%A0%D7%99%D7%9D.JPG" />
      <div class="content"><span class="title">Tulip <span class="badge">💧 Thirsty!</span></span><span class="description">Next: 2026-05-09</span></div>
    </div>
    <div class="item">
      <img class="plant-image" src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f8/Iris_sanguinea_cultivar%2C_Wakehurst_Place%2C_UK_-_Diliff.jpg/500px-Iris_sanguinea_cultivar%2C_Wakehurst_Place%2C_UK_-_Diliff.jpg" />
      <div class="content"><span class="title">Iris <span class="badge">💧 Thirsty!</span></span><span class="description">Next: 2026-05-09</span></div>
    </div>
    <div class="item">
      <img class="plant-image" src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Convallaria_majalis_inflorescence_-_Keila.jpg/500px-Convallaria_majalis_inflorescence_-_Keila.jpg" />
      <div class="content"><span class="title">Lily plant</span><span class="description">Next: 2026-05-13</span></div>
    </div>
    <div class="item">
      <img class="plant-image" src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/The_ferns_of_Great_Britain%2C_and_their_allies_the_club-mosses%2C_pepperworts%2C_and_horsetails_%28Pl._2%29_%288515393495%29.jpg/500px-The_ferns_of_Great_Britain%2C_and_their_allies_the_club-mosses%2C_pepperworts%2C_and_horsetails_%28Pl._2%29_%288515393495%29.jpg" />
      <div class="content"><span class="title">Fern <span class="badge">💧 Thirsty!</span></span><span class="description">Next: 2026-05-12</span></div>
    </div>
  </div>
  <div class="title_bar"><span>Plant Watering Schedule</span><span>Private Plugin</span></div>
</div>
</body>
</html>
