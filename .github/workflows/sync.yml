name: Sync Plant Watering Schedule to TRMNL

on:
  schedule:
    # 2:20 AM EDT = 6:20 AM UTC
    - cron: '20 6 * * *'
    # 1:48 PM EDT = 5:48 PM UTC (17:48)
    - cron: '48 17 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI
    inputs:
      water_all:
        description: 'Mark all due plants as watered (Flic simulation)'
        required: false
        type: boolean
        default: false
  repository_dispatch: # Webhook trigger for Flic buttons / IFTTT Pro
    types: [flic_water_all]

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    # Select environment based on branch (main -> Production, others -> Development)
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Development' }}

    permissions:
      contents: write # Needed to push assets back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run sync
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
          TRMNL_DEVICE_API_KEY: ${{ secrets.TRMNL_DEVICE_API_KEY }}
          EVENT_TYPE: ${{ github.event.action }}
          WATER_ALL: ${{ github.event.inputs.water_all }}
        run: python sync.py


      - name: Commit and Push Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated: update plant assets" && git push)
