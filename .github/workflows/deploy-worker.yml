name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Development' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'worker'
          secrets: |
            GITHUB_PAT
            TRMNL_DEVICE_API_KEY_DEV
            TRMNL_DEVICE_API_KEY_PROD
            TRMNL_PLUGIN_ID_DEV
            TRMNL_PLUGIN_ID_PROD
            VOICEMONKEY_TOKEN
            VOICEMONKEY_DEVICE
        env:
          GITHUB_PAT: ${{ secrets.PAT_GITHUB || secrets.GITHUB_TOKEN }}
          TRMNL_DEVICE_API_KEY_DEV: ${{ secrets.TRMNL_DEVICE_API_KEY_DEV }}
          TRMNL_DEVICE_API_KEY_PROD: ${{ secrets.TRMNL_DEVICE_API_KEY_PROD }}
          TRMNL_PLUGIN_ID_DEV: ${{ secrets.TRMNL_PLUGIN_ID_DEV || '65837e' }}
          TRMNL_PLUGIN_ID_PROD: ${{ secrets.TRMNL_PLUGIN_ID_PROD }}
          VOICEMONKEY_TOKEN: ${{ secrets.VOICEMONKEY_TOKEN }}
          VOICEMONKEY_DEVICE: ${{ secrets.VOICEMONKEY_DEVICE }}
