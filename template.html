<style>
  .layout { 
    width: 800px; height: 480px; 
    display: flex; flex-direction: column; 
    padding: 20px; box-sizing: border-box; 
    font-family: sans-serif; background: #fff;
  }

  /* 8-Plant Grid (Compact) */
  .grid { 
    display: grid; grid-template-columns: repeat(4, 1fr); 
    grid-template-rows: repeat(2, 1fr);
    gap: 15px; flex-grow: 1; 
  }

  .item { 
    border: 4px solid #000; border-radius: 8px;
    display: flex; flex-direction: column; 
    align-items: center; justify-content: center;
    padding: 10px; position: relative;
  }

  .img-container {
    width: 70px; height: 70px; margin-bottom: 10px;
    border: 3px solid #000; border-radius: 50%;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }

  .plant-image { 
    width: 100%; height: 100%; object-fit: cover;
    filter: grayscale(100%) contrast(200%); 
  }

  .emoji { font-size: 45px; }

  .name { 
    font-size: 20px; font-weight: 900; text-align: center;
    line-height: 1.1; margin-bottom: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .date { font-size: 16px; font-weight: 700; padding-top: 2px; }

  /* Thirsty Badge - Now a solid corner tab */
  .thirsty-flag {
    position: absolute; top: 0; right: 0;
    background: #000; color: #fff;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    border-radius: 0 4px 0 10px;
  }

  /* Footer */
  .footer { 
    margin-top: 15px; padding: 12px 25px;
    background: #000; color: #fff; border-radius: 8px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 20px;
  }
</style>

{% assign count = items.size %}

<div class="layout">
  {% if count == 0 %}
    <div style="flex-grow:1; display:flex; flex-direction:column; align-items:center; justify-content:center;">
      <div style="font-size:100px;">🍹</div>
      <div style="font-size:40px; font-weight:900;">All Hydrated!</div>
    </div>
  {% else %}
    <div class="grid">
      {% for item in items %}
        <div class="item">
          <div class="thirsty-flag">💧</div>
          <div class="img-container">
            {% if item.i %}
              <img class="plant-image" src="{{ item.i }}" />
            {% else %}
              <span class="emoji">🪴</span>
            {% endif %}
          </div>
          <div class="name">{{ item.n }}</div>
          <div class="date">Due: {{ item.x }}</div>
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <div class="footer">
    <span style="font-size:20px; font-weight:900;">🌿 PLANT WATERING DASHBOARD</span>
    <span style="font-size:16px;">{{ count }} PLANTS NEED ATTENTION</span>
  </div>
</div>
