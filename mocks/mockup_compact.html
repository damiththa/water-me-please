<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TRMNL Plant Watering — Live Airtable Data</title>
<style>
  body { background-color: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .trmnl-screen { width: 800px; height: 480px; background-color: #ffffff; border: 10px solid #333; border-radius: 12px; display: flex; flex-direction: column; padding: 25px 30px 20px; box-sizing: border-box; color: #000; }

  /* Base */
  .list { flex-grow: 1; align-content: start; }
  .item { display: flex; flex-direction: column; align-items: center; text-align: center; border: 2px solid #ccc; border-radius: 12px; position: relative; }
  .badge { position: absolute; background-color: #000; color: #fff; border: 3px solid #fff; font-weight: bold; }
  .plant-image { border-radius: 50%; object-fit: cover; filter: grayscale(100%) contrast(150%); border: 3px solid #000; }
  .emoji-fallback { display: flex; justify-content: center; align-items: center; }

  /* 7 plants → Compact 4-column */
  .grid-compact { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px; }
  .grid-compact .item { padding: 14px 10px; border-radius: 8px; }
  .grid-compact .plant-image, .grid-compact .emoji-fallback { width: 60px; height: 60px; margin-bottom: 8px; border-width: 2px; font-size: 34px; }
  .grid-compact .title { font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; line-height: 1.2; }
  .grid-compact .description { font-size: 15px; color: #444; margin-top: 4px; }
  .grid-compact .badge { top: -9px; right: -9px; font-size: 12px; padding: 3px 9px; border-radius: 12px; border-width: 2px; }

  /* Title bar */
  .title_bar { border-top: 3px solid #000; padding-top: 14px; display: flex; align-items: center; justify-content: space-between; font-size: 20px; font-weight: bold; margin-top: auto; }
  .data-source { font-size: 13px; font-weight: normal; color: #777; }
</style>
</head>
