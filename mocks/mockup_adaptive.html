<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TRMNL Plant Watering — Adaptive Layout Mockup</title>
<style>
  body { background-color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
  
  .layout { 
    width: 800px; height: 480px; 
    display: flex; flex-direction: column; 
    padding: 15px; box-sizing: border-box; 
    font-family: sans-serif; background: #fff;
    border: 8px solid #222; border-radius: 10px;
  }

  /* Adaptive Grid */
  .grid { 
    display: grid;
    gap: 10px; flex-grow: 1;
    justify-content: center;
  }
  .grid-4 { grid-template-columns: repeat(4, minmax(0, 170px)); }
  .grid-5 { grid-template-columns: repeat(5, minmax(0, 140px)); }

  .item { 
    border: 3px solid #000; border-radius: 8px;
    display: flex; flex-direction: column; 
    align-items: center; justify-content: flex-start;
    padding: 12px 8px 8px; position: relative;
    overflow: hidden;
  }

  .img-container {
    width: 65px; height: 65px; margin-bottom: 6px;
    border: 2px solid #000; border-radius: 50%;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .plant-image { 
    width: 100%; height: 100%; object-fit: cover;
    filter: grayscale(100%) contrast(130%) brightness(110%); 
  }

  .emoji { font-size: 32px; }

  .name { 
    font-size: 15px; font-weight: 900; text-align: center;
    line-height: 1.1; margin-bottom: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    word-break: break-word;
  }

  .date { font-size: 13px; font-weight: 700; padding-top: 2px; }

  /* Thirsty Badge */
  .thirsty-flag {
    position: absolute; top: 0; right: 0;
    background: #000; color: #fff;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    border-radius: 0 5px 0 8px;
  }

  /* Overdue highlight */
  .overdue {
    border-width: 4px;
    background: #f0f0f0;
  }

  /* Footer */
  .footer { 
    margin-top: 10px; padding: 10px 20px;
    background: #000; color: #fff; border-radius: 8px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 15px; flex-shrink: 0;
  }
  .footer-title { font-size: 18px; font-weight: 900; }
  .footer-count { font-size: 14px; }
</style>
</head>
<body>
<div class="layout">
  <!-- 10 plants → 5-column grid -->
