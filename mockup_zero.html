<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { background-color: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .trmnl-screen { width: 800px; height: 480px; background-color: #ffffff; border: 10px solid #333; border-radius: 12px; display: flex; flex-direction: column; padding: 30px; box-sizing: border-box; color: #000; }
  .list { flex-grow: 1; align-content: start; }
  
  /* Zero Plants */
  .zero-plants { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
  .zero-icon { font-size: 80px; margin-bottom: 20px; }
  .zero-title { font-size: 40px; font-weight: bold; }
  .zero-desc { font-size: 24px; color: #555; margin-top: 10px; }
  .title_bar { border-top: 3px solid #000; padding-top: 20px; display: flex; align-items: center; justify-content: space-between; font-size: 22px; font-weight: bold; margin-top: auto; }
</style>
</head>
<body>
<div class="trmnl-screen">
  <div class="list zero-plants">
    <div class="zero-icon">😎</div>
    <div class="zero-title">Phew! No Thirsty Plants! 🌴</div>
    <div class="zero-desc">Your indoor jungle is perfectly hydrated. Put your feet up!</div>
  </div>
  <div class="title_bar"><span>Plant Watering Schedule</span><span>Private Plugin</span></div>
</div>
</body>
</html>
