<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TRMNL Plant Watering — 2KB Limit Mockup (V3.1)</title>
<style>
  body { background-color: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
  
  .layout { 
    width: 800px; height: 480px; 
    background-color: #fff;
    border: 10px solid #333;
    border-radius: 12px;
    display: flex; flex-direction: column; 
    padding: 20px; box-sizing: border-box; 
    color: #000;
  }

  /* 8-Plant Grid (Compact) */
  .grid { 
    display: grid; grid-template-columns: repeat(4, 1fr); 
    grid-template-rows: repeat(2, 1fr);
    gap: 15px; flex-grow: 1; 
  }

  .item { 
    border: 4px solid #000; border-radius: 8px;
    display: flex; flex-direction: column; 
    align-items: center; justify-content: center;
    padding: 10px; position: relative;
  }

  .img-container {
    width: 70px; height: 70px; margin-bottom: 10px;
    border: 3px solid #000; border-radius: 50%;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }

  .plant-image { 
    width: 100%; height: 100%; object-fit: cover;
    filter: grayscale(100%) contrast(200%); 
  }

  .emoji { font-size: 45px; }

  .name { 
    font-size: 20px; font-weight: 900; text-align: center;
    line-height: 1.1; margin-bottom: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .date { font-size: 16px; font-weight: 700; padding-top: 2px; }

  /* Thirsty Badge - Now a solid corner tab */
  .thirsty-flag {
    position: absolute; top: 0; right: 0;
    background: #000; color: #fff;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    border-radius: 0 4px 0 10px;
  }

  /* Footer */
  .footer { 
    margin-top: 15px; padding: 12px 25px;
    background: #000; color: #fff; border-radius: 8px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 20px;
  }

  /* Zero Plants - Jazzed Up */
  .zero-plants { 
    display: flex; flex-direction: column; 
    align-items: center; justify-content: center; 
    flex-grow: 1; text-align: center;
    background: #fff; border-radius: 12px;
    border: 6px dashed #000; margin-bottom: 15px;
  }
  .zero-icon { font-size: 110px; margin-bottom: 20px; }
  .zero-title { font-size: 48px; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; }
  .zero-desc { font-size: 22px; font-weight: 700; color: #444; padding: 0 40px; }
</style>
</head>
<body>
<div class="layout">
  <div class="zero-plants">
    <div class="zero-icon">🍹</div>
    <div class="zero-title">All Hydrated!</div>
    <div class="zero-desc">Your indoor jungle is happy. Time to relax! 🌿✨</div>
  </div>

  <div class="footer">
    <span style="font-size:20px; font-weight:900;">🌿 PLANT WATERING DASHBOARD</span>
    <span style="font-size:16px;">8 PLANTS NEED ATTENTION</span>
  </div>
</div>
</body>
</html>
